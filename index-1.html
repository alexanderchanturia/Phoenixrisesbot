<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>The Phoenix Rises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="scene">
    <div class="embers" id="embers"></div>

    <header class="topbar">
      <div class="coin-readout">
        <span class="coin-value" id="coinValue">0</span>
        <span class="coin-label">ash-coin</span>
      </div>
      <div class="energy-wrap">
        <div class="energy-track"><div class="energy-fill" id="energyFill"></div></div>
        <span class="energy-text" id="energyText">1000 / 1000</span>
      </div>
    </header>

    <main class="stage">
      <button class="phoenix-tap" id="phoenixTap" aria-label="Tap the phoenix">
        <svg viewBox="0 0 200 200" class="phoenix-svg" id="phoenixSvg">
          <defs>
            <radialGradient id="glow" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#FFD37A"/>
              <stop offset="45%" stop-color="#FF6B35"/>
              <stop offset="100%" stop-color="#931621" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="95" r="85" fill="url(#glow)" />
          <path d="M100 30
                   C 80 55, 55 60, 40 90
                   C 60 82, 75 85, 85 100
                   C 60 105, 45 125, 42 155
                   C 65 135, 82 128, 95 132
                   C 90 150, 95 168, 108 178
                   C 110 158, 118 142, 132 132
                   C 148 140, 160 132, 168 112
                   C 150 115, 138 108, 132 95
                   C 150 88, 158 72, 150 50
                   C 138 68, 122 72, 110 62
                   C 112 48, 108 36, 100 30 Z"
                fill="#FF6B35" stroke="#E8A33D" stroke-width="2"/>
          <circle cx="103" cy="88" r="3.5" fill="#14100E" />
        </svg>
        <span class="tap-hint" id="tapHint">tap the flame</span>
      </button>
      <p class="per-tap-line"><span id="perTapValue">1</span> ash-coin per tap</p>
    </main>

    <section class="shop" id="shop">
      <h2 class="shop-title">Rebuild the flame</h2>
      <div class="shop-grid">
        <button class="upgrade-card" id="upgrade-tap" data-kind="tap">
          <span class="upgrade-name">Talon strength</span>
          <span class="upgrade-desc">+1 ash-coin per tap</span>
          <span class="upgrade-level" id="level-tap">lv. 1</span>
          <span class="upgrade-cost" id="cost-tap">50</span>
        </button>
        <button class="upgrade-card" id="upgrade-energy" data-kind="energy">
          <span class="upgrade-name">Wingspan</span>
          <span class="upgrade-desc">+500 max energy</span>
          <span class="upgrade-level" id="level-energy">lv. 1</span>
          <span class="upgrade-cost" id="cost-energy">80</span>
        </button>
        <button class="upgrade-card" id="upgrade-regen" data-kind="regen">
          <span class="upgrade-name">Ember rebirth</span>
          <span class="upgrade-desc">+0.5 energy / sec</span>
          <span class="upgrade-level" id="level-regen">lv. 1</span>
          <span class="upgrade-cost" id="cost-regen">120</span>
        </button>
      </div>
    </section>

    <p class="footnote">Coins are earned in-app only, for now. If Phoenix ever becomes a real TON coin, this balance is what history remembers.</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
